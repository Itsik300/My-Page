<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Видео · Моя панель</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#101422;--surface:#1B2238;--line:#2C3554;
  --text:#E8EBF5;--text-dim:#9AA3C0;--accent:#FFB454;--accent-ink:#1A1206;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#F3F1EC;--surface:#FFFFFF;--line:#DDD8CC;
  --text:#1C2030;--text-dim:#5B6178;--accent:#D97A06;--accent-ink:#FFFFFF;
  --shadow:0 8px 24px rgba(40,35,20,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;min-height:100vh;transition:background .3s,color .3s}
.wrap{max-width:920px;margin:0 auto;padding:28px 22px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:34px}
h1{font-family:'Unbounded',sans-serif;font-size:clamp(1.2rem,3vw,1.7rem);font-weight:700}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);color:var(--text);padding:9px 14px;border-radius:10px;font:600 .85rem 'Manrope';cursor:pointer;text-decoration:none;transition:transform .15s,border-color .15s}
.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.player{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px}
video{width:100%;border-radius:10px;display:block;background:#000}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎬 Видео</h1>
    <div style="display:flex;gap:10px">
      <a class="btn" href="index.html">← На главную</a>
      <button class="btn" id="themeBtn" type="button" aria-label="Переключить тему">🌙 Тема</button>
    </div>
  </header>

  <div class="player">
    <video autoplay muted loop playsinline preload="auto">
      <source src="intro-video-no-watermark.mp4" type="video/mp4">
      Ваш браузер не поддерживает HTML5-видео.
    </video>
  </div>
</div>
<script>
const root=document.documentElement,btn=document.getElementById('themeBtn');
function applyTheme(t){root.dataset.theme=t;btn.textContent=(t==='dark'?'☀️ Светлая':'🌙 Тёмная');localStorage.setItem('theme',t);}
applyTheme(localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
btn.addEventListener('click',()=>applyTheme(root.dataset.theme==='dark'?'light':'dark'));
</script>
</body>
</html>
